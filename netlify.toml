[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Legacy language-prefixed URLs and the old privacy policy all go to the front page.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fi"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fi/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/privacy-policy"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fi/privacy-policy"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
